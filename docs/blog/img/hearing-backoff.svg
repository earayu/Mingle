<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect width="720" height="250" rx="12" fill="#FFFFFF" stroke="#EBEBEF"/>
  <text x="24" y="34" font-size="14" font-weight="600" fill="#1D1D22">它连续不开口，默认节奏自己放慢</text>
  <text x="24" y="54" font-size="12" fill="#8A8A93">两段之间的最小间隔（分钟），横轴是连续没回应的段数</text>
  <!-- baseline y=200, 30min = 130px => 4.33px/min -->
  <line x1="60" y1="200" x2="690" y2="200" stroke="#D9D9E0"/>
  <g font-size="11" fill="#8A8A93" text-anchor="end"><text x="52" y="204">0</text><text x="52" y="139">15</text><text x="52" y="74">30</text></g>
  <line x1="60" y1="70" x2="690" y2="70" stroke="#EBEBEF" stroke-dasharray="3 3"/>
  <g>
    <rect x="80" y="191" width="56" height="9" rx="3" fill="#D9D9E0"/>
    <rect x="160" y="191" width="56" height="9" rx="3" fill="#D9D9E0"/>
    <rect x="240" y="191" width="56" height="9" rx="3" fill="#D9D9E0"/>
    <rect x="320" y="183" width="56" height="17" rx="3" fill="#F4DCBC"/>
    <rect x="400" y="165" width="56" height="35" rx="3" fill="#F4DCBC"/>
    <rect x="480" y="131" width="56" height="69" rx="3" fill="#DF8601"/>
    <rect x="560" y="70" width="56" height="130" rx="3" fill="#975800"/>
  </g>
  <g font-size="12" fill="#1D1D22" text-anchor="middle">
    <text x="108" y="184">2</text><text x="188" y="184">2</text><text x="268" y="184">2</text><text x="348" y="176">4</text><text x="428" y="158">8</text><text x="508" y="124">16</text><text x="588" y="63">30 封顶</text>
  </g>
  <g font-size="11" fill="#8A8A93" text-anchor="middle">
    <text x="108" y="218">0</text><text x="188" y="218">1</text><text x="268" y="218">2</text><text x="348" y="218">3</text><text x="428" y="218">4</text><text x="508" y="218">5</text><text x="588" y="218">6+</text>
  </g>
  <text x="24" y="240" font-size="11" fill="#8A8A93">它在这里说话、有人 @ 或回复它、owner 在群里说话 → 立刻回到 2 分钟。按"它答不答"放慢，不按群里的语速。</text>
</svg>
