name: CI
# Changes that pnpm check (typecheck, biome, vitest) never reads skip this run:
# prose, the Go desktop shell (desktop.yml builds it), spikes, and workflows no test reads.
# Keep the push and pull_request lists identical.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "site/README.md"
      - "desktop/**.md"
      - "docs/**"
      - "LICENSE"
      - "spikes/**"
      - "desktop/**.go"
      - "desktop/go.mod"
      - "desktop/go.sum"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/website.yml"
  pull_request:
    paths-ignore:
      - "*.md"
      - "site/README.md"
      - "desktop/**.md"
      - "docs/**"
      - "LICENSE"
      - "spikes/**"
      - "desktop/**.go"
      - "desktop/go.mod"
      - "desktop/go.sum"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/website.yml"
permissions:
  contents: read
# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
