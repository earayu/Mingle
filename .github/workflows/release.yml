name: Release

# The tag decides what ships (docs/releasing.md):
#   v1.2.0           a release: every platform, uploaded to a draft release. A maintainer
#                    installs it, then publishes the draft, and installed apps update to it.
#   v1.2.0-beta.1    a test build (also -rc.N, -alpha.N): macOS only, published at once as
#                    a prerelease. Installed apps never update to prereleases.
# Run it by hand (Actions → Release → Run workflow) to build every platform without
# uploading anything; the apps are kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag: ${{ steps.plan.outputs.tag }}
      smoke_matrix: ${{ steps.plan.outputs.smoke_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Decide the platforms
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag=""
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"
            test "$tag" = "v$version" || { echo "::error::tag $tag does not match package.json $version"; exit 1; }
            grep -q "^## $version\b" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          fi
          mac='{"name":"macOS","os":"macos-latest","platform":"darwin/arm64,darwin/amd64"}'
          win='{"name":"Windows","os":"ubuntu-latest","platform":"windows/amd64,windows/arm64"}'
          linux='{"name":"Linux","os":"ubuntu-latest","platform":"linux/amd64,linux/arm64"}'
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          if [ -n "$tag" ] && [ "$prerelease" = true ]; then rows="[$mac]"; else rows="[$mac,$win,$linux]"; fi
          smoke_mac='{"name":"macOS","os":"macos-latest","artifact":"mingle-macOS","glob":"*.dmg","arch":"arm64"}'
          smoke_win='{"name":"Windows","os":"windows-latest","artifact":"mingle-Windows","glob":"*.exe","arch":"amd64"}'
          smoke_linux='{"name":"Linux","os":"ubuntu-latest","artifact":"mingle-Linux","glob":"*.tar.gz","arch":"amd64"}'
          if [ -n "$tag" ] && [ "$prerelease" = true ]; then smoke_rows="[$smoke_mac]"; else smoke_rows="[$smoke_mac,$smoke_win,$smoke_linux]"; fi
          {
            echo "matrix={\"include\":$rows}"
            echo "smoke_matrix={\"include\":$smoke_rows}"
            echo "prerelease=$prerelease"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          version="${TAG#v}"
          # The release notes are the version's section of CHANGELOG.md.
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # Fail closed: a published release is immutable, and auth/network
          # errors must stop the run rather than be read as "release missing".
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$RUNNER_TEMP/view.err")"; then
            [ "$draft" = true ] || { echo "::error::release $TAG is already published; refusing to modify it"; exit 1; }
          elif grep -qiE 'not found|HTTP ?404' "$RUNNER_TEMP/view.err"; then
            flags=""
            if [ "$PRERELEASE" = true ]; then flags="--prerelease"; fi
            gh release create "$TAG" --draft --verify-tag $flags --title "Mingle $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::error::cannot inspect release $TAG"
            cat "$RUNNER_TEMP/view.err"
            exit 1
          fi

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # mygo -upload merges one shared SHA256SUMS and shared install scripts
      # with --clobber; parallel legs could race, so uploads are serialized.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      # Without a Developer ID the app is signed ad hoc: it runs, but Gatekeeper
      # blocks it on other Macs until the user allows it in System Settings.
      - name: Import the Developer ID certificate and notary credentials
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          # A formal release must not ship ad hoc signed: require the full
          # signing material up front. Untagged and prerelease builds may
          # still fall back to ad hoc.
          if [ -n "$RELEASE_TAG" ] && [ "$PRERELEASE" = false ]; then
            for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
              test -n "${!name}" || { echo "::error::Formal releases require $name"; exit 1; }
            done
          fi
          if [ -z "$MACOS_CERTIFICATE" ]; then echo "no certificate: ad hoc signing"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Stage Mingle and Node.js
        run: node desktop/scripts/prepare.mjs --platform "${{ matrix.platform }}"

      - name: Build, sign and upload
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            # Tagged builds sign the update archives and deltas recorded in
            # the manifests; without the key there is nothing valid to upload.
            test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "::error::Tagged builds require MYGO_UPDATER_PRIVATE_KEY"; exit 1; }
            # Refuse reruns targeting a release that is already published
            # before this build starts.
            draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" || { echo "::error::cannot inspect release $RELEASE_TAG"; exit 1; }
            [ "$draft" = true ] || { echo "::error::release $RELEASE_TAG is already published; refusing to modify it"; exit 1; }
            upload=-upload
          fi
          go tool mygo build -platform "${{ matrix.platform }}" $upload

      - name: Verify the macOS signatures
        if: matrix.name == 'macOS' && needs.plan.outputs.tag != '' && needs.plan.outputs.prerelease == 'false'
        run: |
          for image in desktop/build/darwin-*/*.dmg; do
            mount="$(mktemp -d)"
            trap 'hdiutil detach "$mount" -quiet || true; rmdir "$mount"' EXIT
            hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount"
            codesign --verify --deep --strict "$mount/Mingle.app"
            spctl --assess --type execute --verbose=2 "$mount/Mingle.app"
            xcrun stapler validate "$image"
            hdiutil detach "$mount" -quiet
            rmdir "$mount"
            trap - EXIT
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mingle-${{ matrix.name }}
          path: |
            desktop/build/*/*.dmg
            desktop/build/*/*-setup-*.exe
            desktop/build/*/*.tar.gz
            desktop/build/*/*.deb
            desktop/build/*/*.rpm
          if-no-files-found: error

  # Unpack each platform's installer and check the bundled Mingle actually runs:
  # `mingle --version` prints, and `mingle start` serves /v1/health.
  smoke:
    needs: [plan, build]
    name: smoke ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts
      - name: Smoke the installer
        shell: bash
        run: |
          file="$(find artifacts -type f -name '${{ matrix.glob }}' | grep ${{ matrix.arch }} | head -1)"
          test -n "$file" || { echo "no ${{ matrix.arch }} ${{ matrix.glob }} in artifacts"; find artifacts -type f; exit 1; }
          echo "smoke: $file"
          export MINGLE_EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          node scripts/package-smoke.mjs "$file"

  # Downloads every uploaded asset and verifies sizes, SHA256SUMS digests and
  # the Ed25519 signatures the update manifests record for each archive and
  # delta, against the release metadata.
  verify:
    needs: [plan, build, smoke]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Drafts are not reachable via /releases/tags/<tag>; resolve the
          # release's own API URL instead.
          release_api="$(gh release view "$TAG" --json apiUrl --jq .apiUrl)"
          gh api "$release_api" > "$RUNNER_TEMP/release.json"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release-assets"
          node scripts/releases.ts verify "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-assets"

  # Test builds go out at once, as prereleases; releases wait in draft for a maintainer.
  publish-prerelease:
    needs: [plan, verify]
    if: needs.plan.outputs.tag != '' && needs.plan.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.plan.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
