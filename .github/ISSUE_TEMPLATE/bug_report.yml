name: Bug report
description: Something in Mingle doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Create an agent with …
        2. In a Feishu group, @-mention it and …
        3. …
  - type: input
    id: version
    attributes:
      label: Mingle version
      description: Settings → About in the app, or `mingle --version`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness
      placeholder: Claude Code, Codex, OpenCode, Kimi Code, …
  - type: input
    id: channel
    attributes:
      label: Chat app
      placeholder: WeChat, Feishu, Slack, Telegram, GitHub, iMessage, …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from `~/.mingle/logs/mingle.log`. Remove tokens, names and message content you don't want to share.
      render: text
